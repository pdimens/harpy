[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "harpy"
version = "4.1.2"
authors = [{name = "Pavel Dimens"}]
description = "Automated workflows to preprocess sequences, trim reads, map sequences, call variants, impute genotypes, and phase haplotypes of Haplotagging data. Batteries included."
requires-python = ">=3.11"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
dependencies = [
    'altair>=6.0.0',
    'click>8.0',
    'papermill',
    'pandas>=3,<4',
    'pillow',
    'polars>=1.39.2',
    'pysam>=0.23',
    'rich-click>=1.8',
    'snakemake>=9.0',
    'vl-convert-python',
]

[project.scripts]
harpy = "harpy.__main__:cli"
hv = "harpy.commands.view:view"
harpy-utils = "harpy.utils:cli"

[project.urls]
Homepage = "https://github.com/pdimens/harpy"

[tool.setuptools.packages.find]
exclude = [".pixi/*", "_build/*", ".environments/*", ".vscode/*", ".report/*", "test/*", ".deprecated/*", "resources/*", ".github/*", "docs/*"]

[tool.setuptools.package-data]
harpy = ["**/*"]

