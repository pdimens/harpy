[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "harpy"
version = "4.2.0"
authors = [{name = "Pavel Dimens"}]
description = "Automated workflows to preprocess sequences, trim reads, map sequences, call variants, impute genotypes, and phase haplotypes of Haplotagging data. Batteries included."
requires-python = ">=3.11"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
dependencies = [
    'altair>=6.0.0',
    'click>8.0',
    'ipykernel',
    'jupyter-book',
    'notebook',
    'numpy>=2.5.3,<3',
    'papermill',
    'pillow',
    'polars>=1.39.2',
    'pysam>=0.23',
    'rich-click>=1.8',
    'snakemake>=9.0',
    'vl-convert-python',
]

[project.scripts]
harpy = "harpy.__main__:cli"
hv = "harpy.commands.view:view"
harpy-utils = "harpy.utils:cli"

[project.urls]
Homepage = "https://github.com/blinkseq/harpy"

[tool.setuptools.packages.find]
exclude = [".pixi/*", "_build/*", ".environments/*", ".vscode/*", ".report/*", "test/*", ".deprecated/*", "resources/*", ".github/*", "docs/*"]

[tool.setuptools.package-data]
harpy = ["**/*"]

# ---- pixi config -----------------------

[tool.pixi.workspace]
authors = ["pdimens <pdimens@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
altair = ">=6.0.0,<7"
bcftools = ">=1.23"
click = ">=8.2"
conda = ">=24.8"
djinn = ">=2.4"
go = ">=1.26.5,<2"
htslib = "1.23.*"
ipykernel = ">=7.3.0,<8"
jupyter-book = ">=2.1.0,<3"
numpy = ">=2.5.3,<3"
papermill = ">=2.6.0,<3"
polars = ">=1.39.2,<2"
pillow = ">=12.2.0,<13"
pysam = "0.23.*"
python = ">=3.11"
rich-click = ">=1.9.3"
samtools = ">=1.23"
seqtk = "*"
snakemake-minimal = ">=9.19.0,<10"
vl-convert-python = ">=2.0.0rc1,<3"

[tool.pixi.pypi-dependencies]
harpy = { path = ".", editable = true }

[tool.pixi.activation]
env = { JUPYTER_NOTARY_DB = ":memory:" }
scripts = ["resources/register-kernel.sh", "resources/shell_completion.sh"]

[tool.pixi.tasks]
build-demux         = {cmd = "go build -C harpy/utils/demuxolotl -o $CONDA_PREFIX/bin/demuxolotl -ldflags='-s -w'"}
completion          = {cmd = "bash resources/generate_completion.sh $CONDA_PREFIX python"}
build = {depends-on = ["build-demux", "completion"]}
