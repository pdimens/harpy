start:
  pro: true
nav:
  mode: stack
input: .
output: .retype
url: pdimens.github.io/harpy/
meta:
  title: " | Harpy"
footer:
  copyright: |
      This work is a collaboration between the lab of Nina Therkildsen and the Cornell Genomics Innovation Hub.

      &copy; Copyright {{ year }}. All rights reserved.
  links:
  - text: Therkildsen Lab
    link: https://www.therkildsenlab.org/
    icon: https://www.therkildsenlab.org/uploads/1/4/5/5/145548022/published/new-logo-smaller.png
    target: blank
  - text: Cornell GIH
    link: https://www.genomicsinnovation.cornell.edu/
    icon: https://raw.githubusercontent.com/pdimens/harpy/refs/heads/main/docs/static/biotech.png
    target: blank
showSidebarFilter: false
backlinks:
  enabled: false
theme:
  base:
    base-link-weight: 500
    nav-item-text-active-weight: 700
    image-rounded: 0.75rem
    nav-item-text-stack: "#1e66f5"
lastUpdated:
  date:
    enabled: true
    source: committer
branding:
  label: v4.3
  logo: static/logo_trans.png
  logoDark: static/logo_trans.png
  logoAlign: left
favicon: static/logo_navbar.png
search:
  mode: partial
edit:
  repo: "https://github.com/pdimens/harpy/edit"
  base: /
  branch: "docs"
links:
- text: BLink-seq
  link: https://blinkseq.github.io/
  icon: https://blinkseq.github.io/_astro/logo.DGThwx8R_1NHPA4.webp
  target: blank
- text: Source
  link: https://github.com/pdimens/harpy
  icon: mark-github
  target: blank
- text: Submit Issue
  link: https://github.com/pdimens/harpy/issues/new/choose
  icon: bug
  target: blank
actions:
  items:
    - text: Share page
      action: share-page
      icon: share-android
    - text: View as Markdown
      action: view-page-markdown
      icon: markdown
    - text: Print page
      action: print-page
      icon: file
exclude:
  - "src/"
  - "test/"
  - "harpy/"
