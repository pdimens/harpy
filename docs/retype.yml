start:
  pro: true
nav:
  mode: stack
input: .
output: .retype
url: pdimens.github.io/harpy/
meta:
  title: " | Harpy"
footer:
  copyright: "&copy; Copyright {{ year }}. All rights reserved."
showSidebarFilter: false
backlinks:
  enabled: false
theme:
  base:
    base-link-weight: 500
    nav-item-text-active-weight: 700
    image-rounded: 0.75rem
    nav-item-text-stack: "#1e66f5"
lastUpdated:
  date:
    enabled: true
    source: committer
branding:
  label: v4.2
  logo: static/logo_trans.png
  logoDark: static/logo_trans.png
  logoAlign: left
favicon: static/logo_navbar.png
search:
  mode: partial
edit:
  repo: "https://github.com/pdimens/harpy/edit"
  base: /
  branch: "docs"
links:
- text: BLink-seq
  link: https://blinkseq.github.io/
  icon: https://blinkseq.github.io/_astro/logo.DGThwx8R_1NHPA4.webp
  target: blank
- text: Therkildsen Lab
  link: https://therkildsen-lab.github.io/
  icon: https://therkildsen-lab.github.io/images/TherkildsenLogo.png
  target: blank
- text: Source
  link: https://github.com/pdimens/harpy
  icon: mark-github
  target: blank
- text: Submit Issue
  link: https://github.com/pdimens/harpy/issues/new/choose
  icon: bug
  target: blank
actions:
  items:
    - text: Share page
      action: share-page
      icon: share-android
    - text: View as Markdown
      action: view-page-markdown
      icon: markdown
    - text: Print page
      action: print-page
      icon: file
exclude:
  - "src/"
  - "test/"
  - "harpy/"
